name: Status CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate incidents JSON syntax
        run: jq empty incidents.json

      - name: Validate incidents against the event schema
        run: node scripts/validate-ledger.mjs incidents.json

      - name: Verify static assets exist
        run: |
          test -f index.html
          test -f status.js
          test -f incidents.js
          test -f nginx.conf

      - name: Status script tests
        run: node --test tests/status-systems.test.mjs tests/ledger.test.mjs
